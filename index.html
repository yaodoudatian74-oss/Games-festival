<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブレインロット・アーケード</title>
<link rel="stylesheet" href="shared/brainrot.css">
</head>
<body>
<header>
  <h1>🧠 ブレインロット・アーケード</h1>
  <span class="muted">全41本（本格3D 1本 ＋ シリーズ40選）</span>
</header>
<main class="hub">
  <section class="flagship">
    <h2>★ 本格3Dゲーム</h2>
    <div class="grid" id="flag"></div>
  </section>
  <section>
    <h2>ブレインロットシリーズ 40選</h2>
    <div class="grid" id="list"></div>
  </section>
  <p class="muted">※キャラクター名はネットミームに由来する名称で、ゲームの仕組みはこのリポジトリ独自の実装です（Roblox作品のアセット・コードは使用していません）。</p>
</main>
<script src="shared/manifest.js"></script>
<script>
  const makeCard = (m) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = m.href || ('play.html?game=' + encodeURIComponent(m.id));
    a.style.setProperty('--c', m.color);
    const em = document.createElement('span'); em.className = 'em'; em.textContent = m.emoji;
    const b = document.createElement('b');
    b.textContent = (m.no ? String(m.no).padStart(2, '0') + '. ' : '') + m.title;
    const s = document.createElement('small'); s.textContent = m.genre;
    a.append(em, b, s);
    return a;
  };
  BR_MANIFEST.filter((m) => m.flagship).forEach((m) => document.getElementById('flag').appendChild(makeCard(m)));
  BR_MANIFEST.filter((m) => !m.flagship).forEach((m) => document.getElementById('list').appendChild(makeCard(m)));
</script>
</body>
</html>
