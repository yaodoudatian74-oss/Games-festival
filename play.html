<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブレインロット・アーケード</title>
<link rel="stylesheet" href="shared/brainrot.css">
</head>
<body>
<header>
  <a href="index.html">← 一覧</a>
  <h1 id="gtitle">読み込み中…</h1>
</header>
<main class="play">
  <canvas id="c" aria-label="ゲーム画面"></canvas>
</main>
<script src="shared/manifest.js"></script>
<script src="shared/brainrot.js"></script>
<script>
  (function () {
    const slug = new URLSearchParams(location.search).get('game');
    const meta = (window.BR_MANIFEST || []).find((m) => m.id === slug && !m.href);
    const title = document.getElementById('gtitle');
    if (!meta) { title.textContent = 'ゲームが見つかりません'; return; }
    document.title = meta.title + ' | ブレインロット・アーケード';
    title.textContent = (meta.no ? String(meta.no).padStart(2, '0') + '. ' : '') + meta.title;
    const s = document.createElement('script');
    s.src = 'games/' + slug + '.js';
    s.onload = () => BR.mount(document.getElementById('c'), slug);
    s.onerror = () => { title.textContent = '読み込みに失敗しました'; };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
